# Ansible Inventory for Marathon Registration Portal Infrastructure

[app_servers]
marathon-node-01 ansible_host=localhost ansible_connection=local

[staging]
marathon-staging ansible_host=localhost ansible_connection=local env_name=staging http_port=8080

[production]
marathon-prod-01 ansible_host=localhost ansible_connection=local env_name=production http_port=8080

[all:vars]
ansible_python_interpreter=/usr/bin/python3
target_dir=/opt/marathon-portal
app_user=marathon
app_group=marathon
java_version=21
docker_image=marathon-portal:1.0.0
